# Owner tracking for block-based recipes (furnace, brewing, crafter, campfire)
# placed: dispatch effects on the player who placed (or first opened) the block
# nearest: dispatch effects on the nearest online player within owner-nearest-radius blocks
owner-mode: placed
owner-nearest-radius: 32

# Brewing stand ghost recipe behaviour
brewing-stand:
  # When true, ghost effects fire once per matched base slot (not once total)
  ghost-per-slot: true

# Scan all loaded villagers on plugin reload to remove PDC keys for disabled recipes
villager-scan-on-reload: true

default-category: "main"

# Shop Integration Settings
shop-integration:
  # Enable integration with EcoShop to allow purchasing missing materials.
  enabled: true
  # Show shop prices in the QuickCraft lore for missing materials.
  show-prices: true
  auto-buy-missing-materials: false
  require-shift-click: true

craft-gui:
  title: "&8Crafting Recipe"
  quick-craft-enabled: true
  buy-materials-enabled: true
  mask:
    items:
      - black_stained_glass_pane
    pattern:
      - "1111111CF"
      - "1iii111BS"
      - "1iii1o1PW"
      - "1iii111MT"
      - "1111111GA"
      - "11101011V"
  buttons:
    recipe-parts-lore:
      - ""
      - "&bLeft Click&f to see the recipe"
      - ""
    back:
      row: 6
      column: 5
      item: barrier name:"&cBack"
      lore: []
    quick-craft:
      row: 6
      column: 1
      item: crafting_table name:"&aQuick Craft"
      lore:
        - ""
        - "&7Materials:"
        - "%materials%"
        - ""
        - "&bLeft Click&f to craft"
        - ""
    prev-variant:
      row: 6
      column: 4
      item:
        active: arrow name:"&aPrevious Method"
        inactive: black_stained_glass_pane name:""
      lore: []
    next-variant:
      row: 6
      column: 6
      item:
        active: arrow name:"&aNext Method"
        inactive: black_stained_glass_pane name:""
      lore: []
    crafter-indicator:
      enabled: false
      row: 5
      column: 7
      item:
        active: crafter name:"&aAvailable in Crafter"
        inactive: gray_dye name:"&7Not available in Crafter"
      lore:
        active: []
        inactive: []
    shapeless-indicator:
      enabled: false
      row: 5
      column: 7
      item:
        active: slime_ball name:"&aShapeless Recipe"
        inactive: gray_dye name:"&7Shaped Recipe"
      lore:
        active: []
        inactive: []
  custom-slots: []

