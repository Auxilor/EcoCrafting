#
# EcoCrafting
# by Exanthiax, _OfTeN_ & joogiebear
#

# Designed for Paper/AdvancedSlimePaper 1.21.x and eco 7.x.
debug: false

# Exclude rotated/mirrored duplicates of shaped crafting recipes
deduplicate-symmetrical: false

# When true, items with no recipe are still shown in categories
show-items-without-recipes: false

# When true, recipe lookup matches full item (name/lore/meta), not just base material
# Useful when renamed items should not show vanilla recipes
strict-item-matching: true

# ItemFlags applied to every display item in EcoCrafting GUIs
# Valid values: HIDE_ATTRIBUTES, HIDE_ENCHANTS, HIDE_UNBREAKABLE, HIDE_DESTROYS,
#               HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_DYE, HIDE_ARMOR_TRIM
item-flags: [ ]

fuel-slot: # The item shown in the fuel slot of furnace/smoker/blast furnace GUIs. Only for display, no interaction.
  item: charcoal name:"&7Fuel"
  lore: [ ]

# Workstation Markers
# Pattern marker key (used in mask.pattern of each GUI section):
#   i = ingredient slot - auto-increments left→right top→bottom (all workstation types)
#   o = output slot (all types)
#   u = smelting fuel slot (display only, no interaction)
#   Workstation sidebar markers (configure items in workstation-markers below):
#   C = crafting table   F = furnace        B = blast furnace
#   S = smoker           P = campfire       M = smithing table
#   T = stonecutter      W = brewing stand  G = grindstone
#   A = anvil            V = villager

workstation-markers:
  crafting_table: # The workstation type.
    active: crafting_table name:"&aCrafting Table" glint # The item shown when viewing this workstation's recipe(s).
    inactive: crafting_table name:"&7Crafting Table" # The item shown when this workstation is available but not currently being viewed.
    not-applicable: gray_dye name:"&8%workstation%" # The item shown when this workstation has no recipe for the current item.
    lore: # The lore for the items above. %workstation% is replaced with the workstation name (Crafting Table, Furnace, etc), from lang.yml.
      active: [ ] # Lore shown when this workstation is active.
      inactive: # Lore shown when this workstation is available but not active.
        - "&bClick to view %workstation% recipe"
      not-applicable: # Lore shown when this workstation is not applicable for the current recipe.
        - "&7No %workstation% recipe available"
  furnace:
    active: furnace name:"&aFurnace" glint
    inactive: furnace name:"&7Furnace"
    not-applicable: gray_dye name:"&8%workstation%"
    lore:
      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
  blast_furnace:
    active: blast_furnace name:"&aBlast Furnace" glint
    inactive: blast_furnace name:"&7Blast Furnace"
    not-applicable: gray_dye name:"&8%workstation%"
    lore:
      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
  smoker:
    active: smoker name:"&aSmoker" glint
    inactive: smoker name:"&7Smoker"
    not-applicable: gray_dye name:"&8%workstation%"
    lore:
      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
  campfire:
    active: campfire name:"&aCampfire" glint
    inactive: campfire name:"&7Campfire"
    not-applicable: gray_dye name:"&8%workstation%"
    lore:
      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
  smithing_table:
    active: smithing_table name:"&aSmithing Table" glint
    inactive: smithing_table name:"&7Smithing Table"
    not-applicable: gray_dye name:"&8%workstation%"
    lore:
      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
  stonecutter:
    active: stonecutter name:"&aStonecutter" glint
    inactive: stonecutter name:"&7Stonecutter"
    not-applicable: gray_dye name:"&8%workstation%"
    lore:
      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
  brewing_stand:
    active: brewing_stand name:"&aBrewing Stand" glint
    inactive: brewing_stand name:"&7Brewing Stand"
    not-applicable: gray_dye name:"&8%workstation%"
    lore:
      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
  grindstone:
    active: grindstone name:"&aGrindstone" glint
    inactive: grindstone name:"&7Grindstone"
    not-applicable: gray_dye name:"&8%workstation%"
    lore:
      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
