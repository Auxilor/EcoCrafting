      active: [ ]
      inactive:
        - "&bClick to view %workstation% recipe"
      not-applicable:
        - "&7No %workstation% recipe available"
  villager:
    active: villager_spawn_egg name:"&aVillager" glint
    inactive: villager_spawn_egg name:"&7Villager"
