# RecipeBook main configuration
# Designed for Paper/AdvancedSlimePaper 1.21.x and eco 7.x.
#
# Pattern marker key (used in mask.pattern of each GUI section):
#   1 = filler (uses mask items list)
#   0 = transparent/empty
#   i = ingredient slot — auto-increments left→right top→bottom (all workstation types)
#   o = output slot (all types)
#   f = smelting fuel slot (display only, no interaction)
#   Workstation sidebar markers (configure items in workstation-markers below):
#   C = crafting table   F = furnace        B = blast furnace
#   S = smoker           P = campfire       M = smithing table
#   T = stonecutter      W = brewing stand  G = grindstone
#   A = anvil            V = villager

debug: false

# Exclude rotated/mirrored duplicates of shaped crafting recipes
deduplicate-symmetrical: true

# When true, recipe lookup matches full item (name/lore/meta), not just base material
# Useful when renamed items should not show vanilla recipes
strict-item-matching: false

fuel-slot:
  item: charcoal name:"&7Fuel"
  lore: []

sounds:
  next-page:
    sound: ui.button_click
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER
  prev-page:
    sound: ui.button_click
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER
  workstation-switch:
    sound: ui.button_click
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER
  back:
    sound: ui.button_click
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER
  slot-click:
    sound: ui.button_click
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER
  quick-craft-success:
    sound: entity.player.levelup
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER
  quick-craft-fail:
    sound: entity.villager.no
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER
  purchase-success:
    sound: entity.experience_orb.pickup
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER
  purchase-fail:
    sound: entity.villager.no
    pitch: 1.0
    volume: 1.0
    enabled: true
    category: MASTER

