enabled: true
# category: main # optional - assigns this recipe to a GUI category (must match a category id in categories/)

type: villager

input1: emerald # first trade ingredient (required)
input2: book # second trade ingredient (optional - omit for single-item trades)

profession: FARMER # optional - restrict to this villager profession (e.g. FARMER, LIBRARIAN, WEAPONSMITH)
min-level: 1 # optional - minimum villager level required (1-5); 0 = any level
chance: 1.0 # probability this trade appears on the villager (0.0-1.0); rolled once per entity and persisted
wandering-trader: false # true = inject into WanderingTrader instead of regular villagers
villager-xp: 0 # XP awarded to the villager on trade completion (0 = none)
max-uses: 0 # /ecocrafting open-trade only - times this trade can be used per GUI (0 = unlimited)

output: enchanted_book name:"&5Villager Enchanted Book"
lore: [ ] # optional - lore lines for the output item

give-result-item: true
# give-result-item: false - consume trade inputs, fire effects, give no item
# effects:
#   - id: give_xp
#     args:
#       amount: 100

# craft-limits: # Optional. Caps how many times this recipe can be crafted.
#   player: 5 # Crafts each player can make. -1 is unlimited.
#   global: 100 # Crafts the whole server can make. -1 is unlimited.

permission: ""
locked-by-default: false
show-when-locked: false
locked-lore: [ ]
visibility-conditions: [ ]
crafting-conditions: [ ]
unlock-conditions: [ ]
