enabled: true

type: stonecutter

input: deepslate

outputs:
  - item: cobbled_deepslate_slab name:"&fstonecutter_ghost_mixed_1"
    lore:
      - "&8stonecutter | output 1 | no ghost"
    ghost: false

  - item: cobbled_deepslate_stairs name:"&fstonecutter_ghost_mixed_2"
    lore:
      - "&8stonecutter | output 2 | no ghost"
    ghost: false

  - item: deepslate_brick_wall name:"&fstonecutter_ghost_mixed_3"
    lore:
      - "&8stonecutter | output 3 | ghost"
      - "&cNo item given — effects fire instead"
    ghost: true
    effects:
      - id: send_message
        args:
          message: "&aGhost craft triggered: stonecutter"
    conditions: []

permission: ""
locked-by-default: false
show-when-locked: false
locked-lore: []
visibility-conditions: []
crafting-conditions: []
unlock-conditions: []
