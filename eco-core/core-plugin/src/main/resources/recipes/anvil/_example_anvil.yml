enabled: true
# category: main # optional - assigns this recipe to a GUI category (must match a category id in categories/)

type: anvil

base: iron_sword # item in the left slot (required)
material: diamond # item in the right slot (optional - omit for rename-only)

result-name: "&bDiamond-Edged Sword" # optional - renames the result item
repair-cost: 3 # levels displayed and consumed

output: diamond_sword name:"&bDiamond-Edged Sword"
lore: [ ] # optional - lore lines for the output item

give-result-item: true
# give-result-item: false # No item is given. Effects fire on every craft either way.
# effects:
#   - id: give_xp
#     args:
#       amount: 30

# craft-limits: # Optional. Caps how many times this recipe can be crafted.
#   player: 5 # Crafts each player can make. -1 is unlimited.
#   global: 100 # Crafts the whole server can make. -1 is unlimited.

permission: ""
locked-by-default: false
show-when-locked: false
locked-lore: [ ]
visibility-conditions: [ ]
crafting-conditions: [ ]
unlock-conditions: [ ]
