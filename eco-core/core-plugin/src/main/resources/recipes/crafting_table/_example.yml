enabled: true
# category: main   # optional — assigns this recipe to a GUI category (must match a category id in categories/)

type: crafting_table

# 3x3 grid, left-to-right top-to-bottom. Use eco item lookup format.
# Empty slots = "" (blank string).
recipe:
  - diamond
  - diamond
  - diamond
  - diamond
  - netherite_ingot
  - diamond
  - diamond
  - diamond
  - diamond

shapeless: false # true = any slot order
symmetry: false # true = register all rotations/mirrors automatically

# support-crafter: true = recipe also fires in the vanilla Crafter block
# (auto-crafts on redstone signal). Default false. Shapeless support-crafter
# recipes are positional-only inside the Crafter (eco's CrafterRecipe builds
# a ShapedRecipe regardless of the shapeless flag).
support-crafter: false

output: netherite_sword name:"&6Example Sword"
lore: [] # optional — lore lines for the output item

give-result-item: true       # false = no item given; triggers libreforge effects instead
# effects:
#   - id: give_xp
#     args:
#       xp: 100
# conditions: []

permission: ""           # leave blank for no permission requirement
locked-by-default: false # true = recipe hidden until unlocked
show-when-locked: false  # show recipe in GUI even when locked (with locked-lore)
locked-lore:
  - "&cUnlock this recipe to craft it."

visibility-conditions: []  # libreforge conditions — hide recipe from GUI if not met
crafting-conditions: []    # libreforge conditions — block crafting if not met
unlock-conditions: []      # auto-unlock on join if these are met
