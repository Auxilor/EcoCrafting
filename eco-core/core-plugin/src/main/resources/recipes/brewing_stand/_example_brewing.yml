enabled: true
# category: main # optional - assigns this recipe to a GUI category (must match a category id in categories/)

type: brewing_stand

base: glass_bottle # item in the bottle slots (can be an existing potion too)
ingredient: nether_wart # item in the ingredient slot (top)
brew-time: 20 # time in ticks to brew the potion (20 ticks = 1 second)

output: potion name:"&dExample Potion"
lore: [ ] # optional - lore lines for the output item

give-result-item: true
# give-result-item: false # No item is given. Effects fire on every craft either way.
# With brewing-stand.effect-recipes-per-slot, effects fire once per potion slot when false.
# effects:
#   - id: give_effect
#     args:
#       effect: speed
#       duration: 200
#       amplifier: 1

permission: ""
locked-by-default: false
show-when-locked: false
locked-lore: [ ]
visibility-conditions: [ ]
crafting-conditions: [ ]
unlock-conditions: [ ]
